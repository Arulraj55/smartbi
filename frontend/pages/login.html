<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartBI</title>
    <link rel="stylesheet" href="/assets/shared.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">S</span>
                <div class="logo-text">
                    <div class="logo-title">SmartBI</div>
                    <div class="logo-subtitle">BUSINESS INTELLIGENCE</div>
                </div>
            </div>
        </div>
        <ul class="nav-menu">
            <li><a href="/index.html">🏠 Home</a></li>
            <li><a href="upload.html">📤 Upload</a></li>
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="reports.html">📄 Reports</a></li>
            <li><a href="history.html">📜 History</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="login-section">
                <h3>🔐 Sign In</h3>
                <form id="loginForm">
                    <input type="text" id="username" placeholder="Username" required autocomplete="username">
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                    <button type="submit" class="btn-primary">Log In →</button>
                </form>
                <div id="loginMessage" class="auth-message" style="display:none;"></div>
                <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                    Don't have an account? <a href="signup.html" style="color: var(--accent-cyan);">Create one</a>
                </p>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <div class="header-content">
                <h1>✨ Welcome Back</h1>
                <p class="subtitle">Log in to access your SmartBI dashboard.</p>
            </div>
        </header>
    </main>

    <script src="../assets/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('loginMessage');
            messageEl.style.display = 'none';
            try {
                // Use the SmartBiApi login helper (which already prefixes BASE_URL)
                const result = await SmartBiApi.login(username, password);
                if (result.ok) {
                    messageEl.textContent = result.data.message + ' Redirecting...';
                    messageEl.className = 'auth-message success';
                    messageEl.style.display = 'block';
                    // After successful login, go to the upload page (or dashboard)
                    setTimeout(() => window.location.href = 'upload.html', 1500);
                } else {
                    messageEl.textContent = result.data.message || 'Login failed.';
                    messageEl.className = 'auth-message error';
                    messageEl.style.display = 'block';
                }
            } catch (err) {
                messageEl.textContent = 'Error: Cannot connect to server.';
                messageEl.className = 'auth-message error';
                messageEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
