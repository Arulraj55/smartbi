<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Datasets - SmartBI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar-brand { color: white; font-size: 24px; font-weight: 900; }

    .navbar-menu { display: flex; gap: 30px; align-items: center; }

    .navbar-menu a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .navbar-menu a:hover, .navbar-menu a.active {
      background: rgba(255,255,255,0.2);
    }

    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

    .card {
      background: white;
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .card h2 { font-size: 24px; margin-bottom: 20px; color: #333; }

    .compare-selectors {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 20px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .select-group label {
      font-size: 14px;
      font-weight: 600;
      color: #666;
    }

    .upload-select {
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
    }

    .btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      height: 48px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .message {
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      background: #fff9e6;
      color: #996600;
      border: 1px solid #ffecb3;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .kpi-card {
      background: #f9f9ff;
      border: 2px solid #e8e8ff;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kpi-card h3 {
      font-size: 15px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-comparison {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
    }

    .kpi-val-group {
      display: flex;
      flex-direction: column;
    }

    .kpi-val-label { font-size: 11px; color: #999; }
    .kpi-val { font-size: 18px; font-weight: 700; color: #333; }

    .kpi-change-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .kpi-change-badge.up { background: #dcfce7; color: #166534; }
    .kpi-change-badge.down { background: #fee2e2; color: #991b1b; }
    .kpi-change-badge.flat { background: #f1f5f9; color: #475569; }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      margin-top: 30px;
    }

    .chart-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .chart-card h3 { font-size: 18px; margin-bottom: 20px; color: #333; }

    @media (max-width: 1024px) {
      .compare-selectors { grid-template-columns: 1fr; }
      .charts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">SmartBI</div>
    <div class="navbar-menu">
      <a href="/home">Home</a>
      <a href="/upload">Upload</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/compare" class="active">Compare</a>
      <a href="/reports">Reports</a>
      <a href="/history">History</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>⚖️ Historical Dataset Comparison</h2>
      <p style="font-size:14px;color:#666;margin-bottom:20px;">Select two uploaded files from the same domain to compare performance growth and trends.</p>
      
      <div class="compare-selectors">
        <div class="select-group">
          <label for="uploadA">Baseline Dataset (Upload A - Older)</label>
          <select id="uploadA" class="upload-select" onchange="validateDomainMatch()">
            <option value="">Select baseline dataset...</option>
          </select>
        </div>
        <div class="select-group">
          <label for="uploadB">Target Dataset (Upload B - Newer)</label>
          <select id="uploadB" class="upload-select" onchange="validateDomainMatch()">
            <option value="">Select target dataset...</option>
          </select>
        </div>
        <button class="btn" id="compareBtn" onclick="runComparison()">Compare</button>
      </div>
      
      <div id="errorBanner" class="message" style="display:none; background:#fee; color:#c33; border-color:#fcc; margin-top:15px;"></div>
    </div>

    <div id="comparisonResults" style="display:none;">
      <div class="card">
        <h2>Comparison Summary — <span id="domainLabel" style="color:#667eea;"></span></h2>
        <div id="kpiComparisonGrid" class="kpi-grid"></div>
      </div>

      <div class="charts-grid" id="comparisonCharts"></div>
    </div>

    <div id="noResults" class="card" style="text-align:center;">
      <div class="message">⚖️ Select baseline and target datasets above and click Compare.</div>
    </div>
  </div>

  <script>
    let uploads = [];
    const chartInstances = {};

    async function logout() {
      try { await fetch('https://smartbi-backend.onrender.com/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch(e) {}
      window.location.href = '/';
    }

    async function loadUploads() {
      try {
        const res = await fetch('https://smartbi-backend.onrender.com/api/history/uploads', { credentials: 'include' });
        if (!res.ok) return;
        const data = await res.json();
        uploads = data.items || [];
        
        const selectA = document.getElementById('uploadA');
        const selectB = document.getElementById('uploadB');

        uploads.forEach(item => {
          const optA = document.createElement('option');
          optA.value = item.id;
          optA.textContent = `${item.file_name} — ${item.domain_name} (${new Date(item.created_at).toLocaleDateString()})`;
          optA.dataset.domain = item.domain_name;
          selectA.appendChild(optA);

          const optB = document.createElement('option');
          optB.value = item.id;
          optB.textContent = `${item.file_name} — ${item.domain_name} (${new Date(item.created_at).toLocaleDateString()})`;
          optB.dataset.domain = item.domain_name;
          selectB.appendChild(optB);
        });

        // Set default initial selection
        if (uploads.length >= 2) {
          selectA.value = uploads[1].id;
          selectB.value = uploads[0].id;
          validateDomainMatch();
        }
      } catch(e) {
        showError('Failed to load uploads history: ' + e.message);
      }
    }

    function validateDomainMatch() {
      const selectA = document.getElementById('uploadA');
      const selectB = document.getElementById('uploadB');
      const errEl = document.getElementById('errorBanner');
      errEl.style.display = 'none';

      const optA = selectA.options[selectA.selectedIndex];
      const optB = selectB.options[selectB.selectedIndex];

      if (selectA.value && selectB.value) {
        if (optA.dataset.domain !== optB.dataset.domain) {
          errEl.textContent = `⚠️ Warning: Domains do not match (${optA.dataset.domain} vs ${optB.dataset.domain}). Comparisons must be within the same domain.`;
          errEl.style.display = 'block';
          document.getElementById('compareBtn').disabled = true;
          return false;
        } else if (selectA.value === selectB.value) {
          errEl.textContent = `⚠️ Warning: You have selected the same dataset for both options.`;
          errEl.style.display = 'block';
          document.getElementById('compareBtn').disabled = true;
          return false;
        }
      }
      document.getElementById('compareBtn').disabled = false;
      return true;
    }

    function showError(msg) {
      const errEl = document.getElementById('errorBanner');
      errEl.textContent = msg;
      errEl.style.display = 'block';
      document.getElementById('comparisonResults').style.display = 'none';
      document.getElementById('noResults').style.display = 'block';
    }

    async function runComparison() {
      const idA = document.getElementById('uploadA').value;
      const idB = document.getElementById('uploadB').value;
      if (!idA || !idB) return;

      if (!validateDomainMatch()) return;

      document.getElementById('noResults').innerHTML = '<div class="message">⏳ Computing dataset differences and trends...</div>';
      document.getElementById('noResults').style.display = 'block';
      document.getElementById('comparisonResults').style.display = 'none';

      try {
        const res = await fetch(`https://smartbi-backend.onrender.com/api/analytics/compare?upload_a=${idA}&upload_b=${idB}&chart=true`, { credentials: 'include' });
        
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showError('Comparison error: ' + (data.message || res.statusText));
          return;
        }

        const data = await res.json();
        
        document.getElementById('noResults').style.display = 'none';
        document.getElementById('domainLabel').textContent = data.domain;
        
        renderKPIComparison(data.comparison || {});
        renderComparisonCharts(data.charts || {});
        
        document.getElementById('comparisonResults').style.display = 'block';
      } catch(e) {
        showError('Connection error: ' + e.message);
      }
    }

    function renderKPIComparison(comparison) {
      const grid = document.getElementById('kpiComparisonGrid');
      grid.innerHTML = '';
      
      const entries = Object.entries(comparison).filter(([key, metrics]) => {
        // Exclude internal metadata and keep scalar compare results
        return !key.startsWith('_') && key !== 'columns' && typeof metrics.old === 'number';
      });

      if (entries.length === 0) {
        grid.innerHTML = '<p style="color:#999;">No comparable numeric KPIs found between these datasets.</p>';
        return;
      }

      grid.innerHTML = entries.map(([key, item]) => {
        const cleanName = key.replace(/_/g, ' ').replace(/total|avg|count/gi, m => m.toUpperCase());
        
        let badgeClass = 'flat';
        let arrow = '·';
        if (item.trend === 'Increase') {
          badgeClass = 'up';
          arrow = '↑';
        } else if (item.trend === 'Decrease') {
          badgeClass = 'down';
          arrow = '↓';
        }

        return `
          <div class="kpi-card">
            <h3>${cleanName}</h3>
            <div class="kpi-comparison">
              <div class="kpi-val-group">
                <span class="kpi-val-label">Baseline (A)</span>
                <span class="kpi-val">${item.old.toLocaleString()}</span>
              </div>
              <div style="font-size: 20px; color: #ccc;">➔</div>
              <div class="kpi-val-group">
                <span class="kpi-val-label">Target (B)</span>
                <span class="kpi-val">${item.new.toLocaleString()}</span>
              </div>
              <div class="kpi-change-badge ${badgeClass}">
                <span>${arrow}</span>
                <span>${item.growth_percent >= 0 ? '+' : ''}${item.growth_percent}%</span>
              </div>
            </div>
            <div style="font-size:11px;color:#888;margin-top:5px;text-align:right;">
              Diff: ${item.difference >= 0 ? '+' : ''}${item.difference.toLocaleString()}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderComparisonCharts(charts) {
      const section = document.getElementById('comparisonCharts');
      section.innerHTML = '';

      if (!charts || (!charts.bar_chart && !charts.trend_chart)) {
        return;
      }

      // 1. Render Bar Chart
      if (charts.bar_chart && charts.bar_chart.labels && charts.bar_chart.labels.length > 0) {
        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML = `
          <h3>Metrics Side-by-Side Comparison</h3>
          <canvas id="compBarChart"></canvas>
        `;
        section.appendChild(card);

        const ctx = document.getElementById('compBarChart').getContext('2d');
        if (chartInstances['compBarChart']) chartInstances['compBarChart'].destroy();

        chartInstances['compBarChart'] = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: charts.bar_chart.labels.map(l => l.replace(/_/g, ' ')),
            datasets: [
              {
                label: 'Baseline (A)',
                data: charts.bar_chart.datasets[0].data,
                backgroundColor: '#764ba2',
                borderColor: '#764ba2',
                borderWidth: 1
              },
              {
                label: 'Target (B)',
                data: charts.bar_chart.datasets[1].data,
                backgroundColor: '#00d9ff',
                borderColor: '#00d9ff',
                borderWidth: 1
              }
            ]
          },
          options: {
            responsive: true,
            scales: { y: { beginAtZero: true } }
          }
        });
      }

      // 2. Render Growth Trend Chart
      if (charts.trend_chart && charts.trend_chart.labels && charts.trend_chart.labels.length > 0) {
        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML = `
          <h3>Growth Trend Percentage (%)</h3>
          <canvas id="compTrendChart"></canvas>
        `;
        section.appendChild(card);

        const ctx = document.getElementById('compTrendChart').getContext('2d');
        if (chartInstances['compTrendChart']) chartInstances['compTrendChart'].destroy();

        chartInstances['compTrendChart'] = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: charts.trend_chart.labels.map(l => l.replace(/_/g, ' ')),
            datasets: [
              {
                label: 'Growth %',
                data: charts.trend_chart.values,
                backgroundColor: charts.trend_chart.values.map(val => val >= 0 ? '#43e97b' : '#fa709a'),
                borderColor: charts.trend_chart.values.map(val => val >= 0 ? '#43e97b' : '#fa709a'),
                borderWidth: 1
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                ticks: { callback: function(value) { return value + '%'; } }
              }
            }
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', loadUploads);
  </script>
</body>
</html>
