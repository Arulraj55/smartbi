<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - SmartBI</title>
  <link rel="stylesheet" href="/assets/shared.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">SmartBI</div>
    <div class="navbar-menu">
      <a href="/home">Home</a>
      <a href="/upload">Upload</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/compare">Compare</a>
      <a href="/reports">Reports</a>
      <a href="/history" class="active">History</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="page-container">
    <div class="content-card">
      <h2>📅 Upload History</h2>
      <div id="historyContent">
        <div class="msg info">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    async function logout() {
      try { await fetch('https://smartbi-backend.onrender.com/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch(e) {}
      window.location.href = '/';
    }

    async function loadHistory() {
      const container = document.getElementById('historyContent');
      try {
        const res = await fetch('https://smartbi-backend.onrender.com/api/history/uploads', { credentials: 'include' });
        const data = await res.json();

        if (!res.ok) {
          container.innerHTML = '<div class="msg error">❌ Failed to load. Please login again.</div>';
          return;
        }

        const items = data.items || [];
        if (items.length === 0) {
          container.innerHTML = '<div class="msg info">📤 No uploads yet. Go to Upload to get started.</div>';
          return;
        }

        container.innerHTML = items.map(item => `
          <div class="history-item">
            <h3>📄 ${item.file_name}</h3>
            <p><strong>Domain:</strong> ${item.domain_name} &nbsp;|&nbsp; <strong>Confidence:</strong> ${item.confidence}%</p>
            <p><strong>Rows:</strong> ${item.row_count} &nbsp;|&nbsp; <strong>Upload ID:</strong> ${item.id}</p>
            <p><strong>Date:</strong> ${new Date(item.created_at).toLocaleString()}</p>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="msg error">❌ Connection error: ' + err.message + '</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadHistory);
  </script>
</body>
</html>
