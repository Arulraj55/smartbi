<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBI - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 50px;
      width: 100%;
      max-width: 450px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 16px;
      color: #666;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 40px;
    }

    .tab {
      flex: 1;
      padding: 15px;
      border: none;
      background: #f5f5f5;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
    }

    .tab:hover {
      background: #e8e8e8;
    }

    .tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .form h2 {
      font-size: 26px;
      margin-bottom: 30px;
      color: #333;
      text-align: center;
    }

    .input-group {
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }

    .input-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .message.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }

    .message.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SmartBI</h1>
      <p>Business Intelligence Platform</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showLogin()">Login</button>
      <button class="tab" onclick="showSignup()">Sign Up</button>
    </div>

    <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
      <h2>Login</h2>

      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <button type="submit" class="btn-submit">Login</button>
      <div id="loginMessage" class="message"></div>
    </form>

    <form id="signupForm" class="form" onsubmit="handleSignup(event)">
      <h2>Sign Up</h2>

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="fullName">
      </div>

      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <button type="submit" class="btn-submit">Sign Up</button>
      <div id="signupMessage" class="message"></div>
    </form>
  </div>

  <script>
    function showLogin() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    }

    function showSignup() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('signupForm').classList.add('active');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const msg = document.getElementById('loginMessage');
      
      msg.style.display = 'none';
      
      try {
        const response = await fetch('https://smartbi-backend.onrender.com/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: data.get('username'),
            password: data.get('password')
          })
        });

        const result = await response.json();

        if (response.ok) {
          msg.textContent = 'Login successful! Redirecting...';
          msg.className = 'message success';
          setTimeout(() => window.location.href = '/home', 1000);
        } else {
          msg.textContent = result.message || 'Login failed';
          msg.className = 'message error';
        }
      } catch (error) {
        msg.textContent = 'Connection error. Check if backend is running.';
        msg.className = 'message error';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const msg = document.getElementById('signupMessage');
      
      msg.style.display = 'none';

      const password = data.get('password');
      if (password.length < 6) {
        msg.textContent = 'Password must be at least 6 characters';
        msg.className = 'message error';
        return;
      }

      try {
        const response = await fetch('https://smartbi-backend.onrender.com/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: data.get('username'),
            email: data.get('email'),
            password: data.get('password'),
            full_name: data.get('fullName')
          })
        });

        const result = await response.json();

        if (response.ok) {
          msg.textContent = 'Account created! Redirecting to login...';
          msg.className = 'message success';
          setTimeout(() => {
            document.querySelectorAll('.tab')[0].click();
            msg.style.display = 'none';
          }, 2000);
        } else {
          msg.textContent = result.message || 'Signup failed';
          msg.className = 'message error';
        }
      } catch (error) {
        msg.textContent = 'Connection error. Check if backend is running.';
        msg.className = 'message error';
      }
    }
  </script>
</body>
</html>
